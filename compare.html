<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandingkan HP - PhoneRec</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .compare-container {
      padding: 2rem 1rem;
    }

    .compare-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .compare-select-wrapper {
      position: relative;
    }

    .compare-search {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--dark-900);
      border: 1px solid var(--dark-700);
      border-radius: 0.5rem;
      color: var(--gray-100);
      font-size: 1rem;
    }

    .compare-search:focus {
      outline: none;
      border-color: var(--primary-600);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
    }

    .compare-table {
      width: 100%;
      overflow-x: auto;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }

    .compare-card {
      position: relative;
    }

    .compare-remove {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background-color: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 2rem;
      height: 2rem;
      cursor: pointer;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .compare-remove:hover {
      background-color: #dc2626;
    }

    .compare-phone-image {
      width: 100%;
      aspect-ratio: 1;
      background-color: var(--dark-800);
      border-radius: 0.5rem;
      overflow: hidden;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .compare-phone-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .compare-phone-name {
      font-size: 1.125rem;
      font-weight: bold;
      color: var(--gray-100);
      margin-bottom: 0.5rem;
      min-height: 3rem;
    }

    .compare-phone-price {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary-500);
      margin-bottom: 1.5rem;
    }

    .compare-specs {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .compare-spec-item {
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--dark-700);
    }

    .compare-spec-label {
      font-size: 0.875rem;
      color: var(--gray-400);
      margin-bottom: 0.25rem;
    }

    .compare-spec-value {
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray-100);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">
          <span class="logo-text">PhoneRec</span>
        </a>
        
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="rekomendasi.html">Rekomendasi</a>
          <a href="compare.html">Bandingkan</a>
        </nav>
        
        <button class="nav-mobile">☰</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="compare-container">
    <div class="container">
      <h1 class="section-title">Bandingkan HP</h1>
      <p class="section-subtitle" style="text-align: center; margin-bottom: 2rem;">
        Pilih HP yang ingin kamu bandingkan (maksimal 3)
      </p>

      <!-- Phone Selectors -->
      <div class="compare-selector">
        <div class="compare-select-wrapper">
          <input 
            type="text" 
            id="search-1" 
            class="compare-search" 
            placeholder="Cari HP pertama..."
            autocomplete="off"
          >
          <div id="dropdown-1" class="datalist-dropdown"></div>
        </div>

        <div class="compare-select-wrapper">
          <input 
            type="text" 
            id="search-2" 
            class="compare-search" 
            placeholder="Cari HP kedua..."
            autocomplete="off"
          >
          <div id="dropdown-2" class="datalist-dropdown"></div>
        </div>

        <div class="compare-select-wrapper">
          <input 
            type="text" 
            id="search-3" 
            class="compare-search" 
            placeholder="Cari HP ketiga..."
            autocomplete="off"
          >
          <div id="dropdown-3" class="datalist-dropdown"></div>
        </div>
      </div>

      <!-- Comparison Result -->
      <div id="compare-result" style="display: none;">
        <div class="comparison-grid" id="comparison-grid"></div>
      </div>

      <div id="compare-empty" class="empty">
        <div class="empty-icon">⚖️</div>
        <p>Pilih minimal 2 HP untuk mulai membandingkan</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <p>&copy; 2026 PhoneRec. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/dummy-data.js"></script>
  <script src="js/update-images.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mobile-menu.js"></script>
  <script src="js/compare.js"></script>
</body>
</html>
